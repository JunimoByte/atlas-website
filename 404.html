<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Atlas</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="assets/ico/Atlas.ico" type="image/x-icon" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0a0b;
            --bg2: #111113;
            --border: rgba(255, 255, 255, 0.07);
            --border2: rgba(255, 255, 255, 0.12);
            --text: #f4f4f5;
            --muted: #71717a;
            --blue: #3b82f6;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 16px;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
        }

        /* Background grid */
        .bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 52px 52px;
            mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 20%, transparent 100%);
            opacity: 0.6;
        }

        .content {
            position: relative;
            z-index: 1;
            animation: fadeUp 0.6s ease both;
        }

        .code {
            font-size: clamp(72px, 15vw, 130px);
            font-weight: 700;
            letter-spacing: -0.05em;
            line-height: 1;
            color: var(--text);
            margin-bottom: 16px;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: var(--border2);
            margin: 0 auto 24px;
        }

        .message {
            font-size: 17px;
            color: var(--muted);
            max-width: 380px;
            margin: 0 auto 36px;
            line-height: 1.65;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--text);
            color: #0a0a0b;
            border: none;
            border-radius: 8px;
            font-size: 14.5px;
            font-weight: 600;
            text-decoration: none;
            letter-spacing: -0.01em;
            transition: opacity 0.15s, transform 0.15s;
        }

        .btn:hover {
            opacity: 0.88;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: scale(0.97);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="bg"></div>

    <div class="content">
        <div class="code">404</div>
        <div class="divider"></div>
        <p class="message">This page doesn't exist. It may have been moved, removed, or the URL may be incorrect.</p>
        <a href="/" class="btn">Back to home</a>
    </div>
</body>

</html>
